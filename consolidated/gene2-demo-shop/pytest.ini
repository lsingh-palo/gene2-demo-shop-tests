[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --reruns 1
    --reruns-delay 2
    --html=reports/html/functional-test-report.html
    --self-contained-html
    --alluredir=reports/allure-results
timeout = 300
timeout_method = thread
markers =
    smoke: critical path
    functional: standard functional
    extended: edge / robustness / security
    bug: bug reproduction (fails until fixed)
    exploratory: promoted from an exploratory session
    flaky: quarantined, excluded from gating with -m "not flaky"
    heal: repaired by the self-healing flow (Rule 20)
